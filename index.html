<!DOCTYPE html>
<html lang="uz">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>China Direct Vodil</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#c62828;--primary-dark:#b71c1c;--primary-light:#ffebee;--gold:#ffc107;--bg:#f5f5f5;--card:#fff;--text:#212121;--text-secondary:#757575;--border:#e0e0e0;--success:#2e7d32;--info:#1565c0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;padding:16px 0;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px rgba(198,40,40,0.3)}
.header-content{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:10px}
.btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-size:0.95rem;font-weight:600;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--gold);color:#333}
.btn:hover{transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,0.15);color:white}
.btn-primary{background:var(--primary);color:white}
.btn-sm{padding:6px 14px;font-size:0.85rem}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.hero{background:linear-gradient(135deg,var(--primary-light) 0%,#fff8e1 100%);padding:40px 0;text-align:center;border-bottom:1px solid var(--border)}
.hero h1{font-size:2.2rem;color:var(--primary-dark);margin-bottom:12px}
.hero p{color:var(--text-secondary);font-size:1.1rem;max-width:600px;margin:0 auto}
.controls{background:white;padding:16px 0;border-bottom:1px solid var(--border);position:sticky;top:70px;z-index:90}
.controls-content{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:12px 16px 12px 44px;border:2px solid var(--border);border-radius:12px;font-size:1rem}
.search-box::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.1rem}
.products-section{padding:32px 0}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;flex-direction:column;border:1px solid var(--border)}
.product-image-wrap{width:100%;height:220px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.product-image-wrap img{width:100%;height:100%;object-fit:cover}
.product-info{padding:20px;flex:1;display:flex;flex-direction:column}
.product-name{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.product-price{font-size:1.5rem;font-weight:800;color:var(--primary-dark);margin-bottom:4px}
.product-footer{display:flex;gap:8px;margin-top:auto;padding-top:16px}
.cart-badge{background:var(--gold);color:#333;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;margin-left:4px}
.cart-sidebar{position:fixed;top:0;right:-420px;width:100%;max-width:420px;height:100vh;background:white;box-shadow:-4px 0 24px rgba(0,0,0,0.15);z-index:200;transition:right 0.3s;display:flex;flex-direction:column}
.cart-sidebar.open{right:0}
.cart-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--primary-light)}
.cart-body{flex:1;overflow-y:auto;padding:16px}
.cart-footer{padding:20px;border-top:1px solid var(--border);background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal.show{opacity:1;pointer-events:all}
.modal-content{background:white;border-radius:20px;width:100%;max-width:520px;padding:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:700}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:2px solid var(--border);border-radius:8px}
.hidden{display:none!important}
.w-full{width:100%}
.close-btn{background:none;border:none;font-size:1.5rem;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="container header-content">
    <div class="logo">🇨🇳 China Direct Vodil</div>
    <div>
      <button class="btn btn-secondary" id="cartBtn">🛒 Savat <span class="cart-badge hidden" id="cartBadge">0</span></button>
      <button class="btn btn-secondary" id="adminBtn">🔐 Admin</button>
    </div>
  </div>
</header>

<div id="customerView">
  <div class="hero">
    <div class="container">
      <h1>🇨🇳 China Direct Vodil</h1>
      <p>Xitoydan to'g'ridan-to'g'ri mahsulotlar katalagiga xush kelibsiz.</p>
    </div>
  </div>
  <div class="controls">
    <div class="container search-box"><input type="text" id="searchInput" placeholder="Mahsulot qidirish..."></div>
  </div>
  <div class="container products-section">
    <div class="products-grid" id="productsGrid"></div>
  </div>
</div>

<div id="adminView" class="hidden container" style="padding-top:20px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <h2>📊 Admin paneli</h2>
    <button class="btn btn-primary" onclick="openModal('productModal')">➕ Yangi mahsulot qo'shish</button>
  </div>
  <p>Bu yerdan qo'shilgan mahsulotlar avtomatik ravishda Firebase bazasiga saqlanadi va barcha mijozlarga ko'rinadi.</p>
</div>

<!-- Product Modal -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3>Yangi mahsulot qo'shish</h3>
      <button class="close-btn" onclick="closeModal('productModal')">×</button>
    </div>
    <form id="productForm">
      <div class="form-group"><label>Mahsulot nomi</label><input type="text" id="pName" required></div>
      <div class="form-group"><label>Sotish narxi (so'm)</label><input type="number" id="pPrice" required></div>
      <div class="form-group"><label>Rasm havolasi (URL)</label><input type="url" id="pImage" placeholder="https://..."></div>
      <div class="form-group"><label>Tavsif</label><textarea id="pDesc"></textarea></div>
      <button type="submit" class="btn btn-primary w-full">💾 Bazaga saqlash</button>
    </form>
  </div>
</div>

<!-- Login Modal -->
<div class="modal" id="loginModal">
  <div class="modal-content" style="max-width:360px">
    <h3>Admin Kirish</h3>
    <form id="loginForm" style="margin-top:12px;">
      <div class="form-group"><label>Parol</label><input type="password" id="adminPass" required></div>
      <button type="submit" class="btn btn-primary w-full">Kirish</button>
    </form>
  </div>
</div>

<script>
// Firebase Sozlamalari (O'zingizning Firebase kalitlaringizni shu yerga qo'ying)
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDQi6b_zalmzcUpJq_oSbqKTm7Bv2xQS38",
  authDomain: "china-direct-vodil.firebaseapp.com",
  projectId: "china-direct-vodil",
  storageBucket: "china-direct-vodil.firebasestorage.app",
  messagingSenderId: "183932106361",
  appId: "1:183932106361:web:7daad4ff476118cd4506a8",
  measurementId: "G-0P0W7L46ZF"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];
const ADMIN_PASS = "admin123";

function $(id){ return document.getElementById(id); }
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }

// Bazadan ma'lumotlarni real-vaqt rejimida olish (Realtime Sync)
db.collection("products").onSnapshot((snapshot) => {
  products = [];
  snapshot.forEach((doc) => {
    products.push({ id: doc.id, ...doc.data() });
  });
  renderProducts();
});

function renderProducts(){
  const grid = $('productsGrid');
  if(products.length === 0){
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;">Hali mahsulotlar yo\'q</p>';
    return;
  }
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-image-wrap">
        ${p.image ? `<img src="${p.image}">` : '📦'}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <p style="font-size:0.85rem;color:#666">${p.desc || ''}</p>
        <div class="product-price">${Number(p.price).toLocaleString()} so'm</div>
      </div>
    </div>
  `).join('');
}

// Admin paneldan yangi mahsulot qo'shish
$('productForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const newProduct = {
    name: $('pName').value,
    price: Number($('pPrice').value),
    image: $('pImage').value,
    desc: $('pDesc').value,
    createdAt: new Date()
  };

  db.collection("products").add(newProduct).then(() => {
    alert("Mahsulot barcha mijozlarga ko'rinadigan qilib bazaga saqlandi!");
    closeModal('productModal');
    $('productForm').reset();
  });
});

$('adminBtn').addEventListener('click', () => openModal('loginModal'));
$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if($('adminPass').value === ADMIN_PASS){
    closeModal('loginModal');
    $('customerView').classList.add('hidden');
    $('adminView').classList.remove('hidden');
  } else {
    alert("Parol xato!");
  }
});
</script>
</body>
</html>
