<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINA DIRECT VODIL</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; padding: 0; background-color: #f4f4f9; }
    header { background-color: #e63946; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 22px; }
    .admin-btn { background-color: #1d3557; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .container { padding: 20px; }
    h2 { margin-top: 0; }
    
    /* Modal / Admin oyna */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; }
    .modal-content h3 { margin-top: 0; }
    .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
    .modal-content button { width: 100%; padding: 10px; background: #2a9d8f; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .close-btn { background: #e63946 !important; margin-top: 5px !important; }

    /* Mahsulotlar katagi */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
    .product-card { background: white; border-radius: 8px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
    .product-card h4 { margin: 10px 0 5px; font-size: 16px; }
    .product-card p { margin: 0; color: #e63946; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1>CHINA DIRECT VODIL</h1>
  <button class="admin-btn" onclick="openAdminModal()">🔒 Admin</button>
</header>

<div class="container">
  <h2>Mahsulotlar katalogi</h2>
  <div class="product-grid" id="product-list"></div>
</div>

<!-- Admin Panel Modal -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3>Yangi mahsulot qo'shish</h3>
    <input type="text" id="pTitle" placeholder="Mahsulot nomi">
    <input type="text" id="pPrice" placeholder="Narxi">
    <input type="text" id="pImage" placeholder="Rasm URL havolasi">
    <button onclick="saveProduct()">Saqlash</button>
    <button class="close-btn" onclick="closeAdminModal()">Yopish</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4m_9D31jA3SskvN91xS4Xz7I-Q11a-0A",
    authDomain: "china-direct-vodil.firebaseapp.com",
    projectId: "china-direct-vodil",
    storageBucket: "china-direct-vodil.appspot.com",
    messagingSenderId: "183932106361",
    appId: "1:183932106361:web:21200df1542f2ee06bbda3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Admin modal oynasini ochish
  window.openAdminModal = function() {
    let pass = prompt("Admin parolini kiriting:");
    if (pass === "admin123") {
      document.getElementById("adminModal").style.display = "flex";
    } else if (pass !== null) {
      alert("Parol noto'g'ri!");
    }
  };

  window.closeAdminModal = function() {
    document.getElementById("adminModal").style.display = "none";
  };

  // Firebase bulutli bazasiga mahsulot qo'shish
  window.saveProduct = async function() {
    let title = document.getElementById("pTitle").value;
    let price = document.getElementById("pPrice").value;
    let image = document.getElementById("pImage").value;

    if (!title || !price || !image) {
      alert("Barcha maydonlarni to'ldiring!");
      return;
    }

    try {
      await addDoc(collection(db, "products"), { title, price, image });
      alert("Mahsulot muvaffaqiyatli saqlandi va barcha foydalanuvchilarga ko'rinadi!");
      document.getElementById("pTitle").value = "";
      document.getElementById("pPrice").value = "";
      document.getElementById("pImage").value = "";
      closeAdminModal();
    } catch (e) {
      alert("Xatolik yuz berdi: " + e.message);
    }
  };

  // Har bir tashrif buyuruvchiga real vaqtda Firebase bazasidan yuklash
  onSnapshot(collection(db, "products"), (snapshot) => {
    let container = document.getElementById("product-list");
    container.innerHTML = "";
    snapshot.forEach((doc) => {
      let data = doc.data();
      container.innerHTML += `
        <div class="product-card">
          <img src="${data.image}" alt="${data.title}">
          <h4>${data.title}</h4>
          <p>${data.price}</p>
        </div>
      `;
    });
  });
</script>

</body>
</html>
