<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINA DIRECT VODIL</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #333333;
            --border: #e5e5ea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
        header { background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
        .header-actions { display: flex; gap: 8px; align-items: center; overflow-x: auto; width: 100%; padding-bottom: 2px; }
        .container { max-width: 600px; margin: 0 auto; padding: 12px; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        
        /* Mahsulotlar kartochkasi */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .price { font-weight: 700; color: var(--primary); margin: 6px 0; }
        
        /* Pastki navigatsiya */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
        .nav-item { text-align: center; font-size: 0.75rem; color: #8e8e93; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item div { font-size: 1.2rem; }

        .hidden { display: none !important; }
        
        /* Jadval va Formalar */
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; margin-top: 10px; font-size: 0.85rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f1f1f6; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; font-size: 0.9rem; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-actions">
            <div class="logo">CHINA DIRECT VODIL</div>
            <button id="installBtn" class="btn btn-outline hidden" style="margin-left: auto; font-size: 0.8rem; padding: 4px 8px;">📱 O'rnatish</button>
        </div>
    </header>

    <div class="container">
        <!-- Asosiy Sahifa: Katalog -->
        <div id="shopPage">
            <input type="text" id="searchInput" placeholder="Mahsulotlarni qidirish..." oninput="filterProducts()">
            <div class="grid" id="productGrid"></div>
        </div>

        <!-- Savat Sahifasi -->
        <div id="cartPage" class="hidden">
            <h2>Savat</h2>
            <div id="cartItems" style="margin-top: 10px;"></div>
            <div id="checkoutForm" class="hidden" style="margin-top: 15px;">
                <h3>Buyurtma berish</h3>
                <input type="text" id="orderName" placeholder="Ismingiz">
                <input type="tel" id="orderPhone" placeholder="Telefon raqam (+998...)">
                <button class="btn btn-success" style="width: 100%;" onclick="submitOrder()">Buyurtmani Tasdiqlash</button>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPage" class="hidden">
            <h2>Admin Panel</h2>
            <div style="margin: 10px 0;">
                <button class="btn" onclick="showAddProductModal()">+ Yangi mahsulot</button>
            </div>
            <h3>Buyurtmalar ro'yxati</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Kodi</th>
                            <th>Mijoz</th>
                            <th>Mahsulot</th>
                            <th>Tel</th>
                            <th>Summa</th>
                            <th>Holati</th>
                            <th>❌</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pastki menyu -->
    <nav>
        <div class="nav-item active" onclick="switchTab('shop')">
            <div>🏠</div>Asosiy
        </div>
        <div class="nav-item" onclick="switchTab('cart')">
            <div>🛒</div>Savat <span id="cartBadge" style="background:var(--danger); color:white; border-radius:50%; padding:1px 5px; font-size:0.6rem;">0</span>
        </div>
        <div class="nav-item" onclick="switchTab('admin')">
            <div>⚙️</div>Admin
        </div>
    </nav>

    <script>
        // Oddiy ma'lumotlar bazasi va holat
        let products = [
            { id: 1, name: "Krossovka Nike", price: 250000, image: "https://via.placeholder.com/150", category: "Oyoq kiyim" },
            { id: 2, name: "Kurtka Zima", price: 450000, image: "https://via.placeholder.com/150", category: "Kiyim" }
        ];
        let cart = [];
        let orders = [];

        function formatPrice(price) {
            return Number(price).toLocaleString() + " so'm";
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('shopPage').classList.add('hidden');
            document.getElementById('cartPage').classList.add('hidden');
            document.getElementById('adminPage').classList.add('hidden');

            if(tab === 'shop') {
                document.getElementById('shopPage').classList.remove('hidden');
                event.currentTarget.classList.add('active');
                renderProducts();
            } else if(tab === 'cart') {
                document.getElementById('cartPage').classList.remove('hidden');
                event.currentTarget.classList.add('active');
                renderCart();
            } else if(tab === 'admin') {
                document.getElementById('adminPage').classList.remove('hidden');
                event.currentTarget.classList.add('active');
                renderAdmin();
            }
        }

        function renderProducts(list = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = list.map(p => `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}">
                    <div class="card-body">
                        <div>
                            <h4>${p.name}</h4>
                            <div class="price">${formatPrice(p.price)}</div>
                        </div>
                        <button class="btn" onclick="addToCart(${p.id})">Savatga</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            cart.push(prod);
            document.getElementById('cartBadge').innerText = cart.length;
            alert("Mahsulot savatga qo'shildi!");
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            if(cart.length === 0) {
                container.innerHTML = "<p>Savat bo'sh</p>";
                document.getElementById('checkoutForm').classList.add('hidden');
                return;
            }
            container.innerHTML = cart.map((item, index) => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border)">
                    <div><b>${item.name}</b><br>${formatPrice(item.price)}</div>
                    <button class="btn btn-danger btn-sm" onclick="removeFromCart(${index})">O'chirish</button>
                </div>
            `).join('');
            document.getElementById('checkoutForm').classList.remove('hidden');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cartBadge').innerText = cart.length;
            renderCart();
        }

        function submitOrder() {
            const name = document.getElementById('orderName').value;
            const phone = document.getElementById('orderPhone').value;
            if(!name || !phone) {
                alert("Iltimos, barcha maydonlarni to'ldiring!");
                return;
            }
            const newOrder = {
                id: Date.now().toString(),
                code: "ORD-" + Math.floor(1000 + Math.random() * 9000),
                name: name,
                phone: phone,
                items: [...cart],
                total: cart.reduce((sum, i) => sum + i.price, 0),
                status: "Tasdiqlandi"
            };
            orders.push(newOrder);
            cart = [];
            document.getElementById('cartBadge').innerText = 0;
            alert("Buyurtmangiz qabul qilindi!");
            switchTab('shop');
        }

        function renderAdmin() {
            const tbody = document.getElementById('adminOrdersTable');
            if(orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Buyurtmalar mavjud emas</td></tr>`;
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td><b>${o.code}</b></td>
                    <td>${o.name}</td>
                    <td>${o.items ? o.items.map(i => i.name).join(', ') : '-'}</td>
                    <td>${o.phone}</td>
                    <td>${formatPrice(o.total)}</td>
                    <td>
                      <select onchange="updateOrderStatus('${o.id}', this.value)" style="padding:4px;border-radius:8px;font-size:0.8rem">
                        <option ${o.status === 'Tasdiqlandi' ? 'selected' : ''}>Tasdiqlandi</option>
                        <option ${o.status === "Yig'ilyapti" ? 'selected' : ''}>Yig'ilyapti</option>
                        <option ${o.status === "Xitoydan O'zbekistonga yo'lga chiqdi" ? 'selected' : ''}>Xitoydan O'zbekistonga yo'lga chiqdi</option>
                        <option ${o.status === 'Buyurtma keldi' ? 'selected' : ''}>Buyurtma keldi</option>
                        <option ${o.status === 'Topshirildi' ? 'selected' : ''}>Topshirildi</option>
                      </select>
                    </td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}')">×</button></td>
                </tr>
            `).join('');
        }

        function updateOrderStatus(id, status) {
            const ord = orders.find(o => o.id === id);
            if(ord) ord.status = status;
        }

        function deleteOrder(id) {
            orders = orders.filter(o => o.id !== id);
            renderAdmin();
        }

        function showAddProductModal() {
            const name = prompt("Mahsulot nomi:");
            const price = prompt("Narxi (so'mda):");
            if(name && price) {
                products.push({ id: Date.now(), name, price: Number(price), image: "https://via.placeholder.com/150", category: "Umumiy" });
                renderProducts();
                alert("Mahsulot qo'shildi!");
            }
        }

        // Dastlabki ishga tushirish
        renderProducts();

        // PWA O'rnatish logikasi
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installBtn');
            installBtn.classList.remove('hidden');
            installBtn.addEventListener('click', () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            });
        });
    </script>
</body>
</html>
